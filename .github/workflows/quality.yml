name: quality

on:
  push:
  pull_request:

jobs:
  hygiene-and-hub:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify repository hygiene and UTF-8
        run: |
          python tools/verify_repository_hygiene.py
          python tools/verify_text_encoding.py
      - name: Install uv
        run: pip install uv
      - name: Test local hub
        run: |
          uv sync --locked --project services/local-hub
          uv run --project services/local-hub ruff check src tests
          uv run --project services/local-hub pytest -q

  pc-workbench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install and test
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm pc:lint
          pnpm pc:test

  android:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile-edge/third_party/screenstream_source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865"
      - name: Configure SDK path
        shell: pwsh
        run: |
          "sdk.dir=$($env:ANDROID_HOME.Replace('\', '/'))" | Set-Content local.properties -Encoding utf8
      - name: Test, build and lint
        run: .\gradlew.bat :learning-domain:test :app:assembleDebug :app:lintDebug
