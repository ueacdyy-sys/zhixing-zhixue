<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知行智学 · 全页面视觉总览</title>
  <style>
    :root{--ink:#19212c;--muted:#687386;--line:#dce4ee;--blue:#176fdb;--bg:#eef4fa;--paper:rgba(255,255,255,.76)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 520px at 4% 0%,#dceeff 0%,transparent 68%),#eef4fa;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}.shell{max-width:1520px;margin:auto;padding:42px 34px 72px}.kicker{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:.08em}.head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin:9px 0 34px}.head h1{font-size:34px;letter-spacing:-.045em;margin:0}.head p{max-width:570px;color:var(--muted);font-size:14px;line-height:1.65;margin:0}.section{margin:38px 0}.section h2{font-size:18px;margin:0 0 14px;letter-spacing:-.02em}.section h2 span{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:18px}.tile{padding:12px;background:var(--paper);border:1px solid rgba(255,255,255,.88);border-radius:18px;box-shadow:0 14px 34px rgba(46,88,134,.1),inset 0 1px rgba(255,255,255,.92);backdrop-filter:blur(16px)}.tile-top{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 11px;gap:10px}.tile b{font-size:13px}.tile a{color:var(--blue);font-size:11px;text-decoration:none;font-weight:650}.frame{width:100%;height:425px;border-radius:13px;overflow:hidden;background:#dde9f4;display:flex;align-items:flex-start;justify-content:center}.device-scale{width:206px;height:413px;overflow:hidden;flex:0 0 auto}.device-scale iframe{width:430px;height:860px;border:0;display:block;transform:scale(.48);transform-origin:top left;pointer-events:none}.note{padding:15px 16px;border-left:3px solid var(--blue);background:rgba(255,255,255,.52);border-radius:0 12px 12px 0;color:#536073;font-size:12px;line-height:1.65;margin-bottom:20px}@media(max-width:640px){.shell{padding:25px 16px}.head{display:block}.head h1{font-size:28px;margin-bottom:10px}.grid{grid-template-columns:1fr}.frame{height:438px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="kicker">ZHIXING ZHIXUE · VISUAL REVIEW</div>
    <div class="head"><h1>全页面视觉总览</h1><p>所有页面均来自同一应用、同一信息架构。缩略图用于横向审阅层级、材质和一致性；点击“全屏查看”可进入单页交互版。</p></div>
    <div class="note">此页覆盖发现、L0–L4、内容图谱、画像统计、连接、设置抽屉、全部设置二级页和全部详情页；不是只展示三个底部导航页。</div>
    <div id="gallery"></div>
  </main>
  <script>
    const groups=[
      ['一级入口与抽屉',[['发现',''],['知识全览','route=profile&profileMode=knowledge'],['知识节点笔记','route=secondary%3Aknowledge-note&knowledgeNode=%E7%94%9F%E6%88%90%E5%BC%8F%20AI'],['学习画像 · 韦恩图','route=profile&profileMode=stats&chart=venn'],['学习画像 · 集合图','route=profile&profileMode=stats&chart=set'],['学习画像 · 散点图','route=profile&profileMode=stats&chart=scatter'],['学习画像 · 饼状图','route=profile&profileMode=stats&chart=pie'],['学习画像 · 柱状图','route=profile&profileMode=stats&chart=bar'],['学习画像 · 折线图','route=profile&profileMode=stats&chart=line'],['连接','route=connect'],['设置抽屉','drawer=1']]],
      ['学习内容路径',[['L0 · 候选与证据','route=content&level=l0'],['L1 · 概念小结','route=content&level=l1'],['L2 · 思维导图','route=content&level=l2&map=mind'],['L2 · 知识图谱','route=content&level=l2&map=graph'],['L3 · 引导练习','route=content&level=l3'],['L4 · 自主表达','route=content&level=l4'],['捕获窗口与证据','route=secondary%3Aevidence'],['材料与实例','route=secondary%3Asource'],['材料摘要','route=secondary%3Asource-detail&source=1'],['概念节点','route=secondary%3Anode&node=%E7%89%88%E6%9D%83%E4%BC%A6%E7%90%86']]],
      ['设置二级页',[['显示','route=setting%3Adisplay'],['通知','route=setting%3Anotice'],['公开媒体会话','route=setting%3Asession'],['视频','route=setting%3Avideo'],['音频','route=setting%3Aaudio'],['网络','route=setting%3Anetwork'],['隐私与数据','route=setting%3Aprivacy'],['通知历史','route=secondary%3Anotice-history'],['白名单导出','route=secondary%3Aexport'],['删除与撤回审计','route=secondary%3Aaudit']]],
      ['画像、连接与设备详情',[['统计范围','route=secondary%3Afilter'],['画像证据','route=secondary%3Aprofile-evidence'],['可追溯证据','route=secondary%3Aevidence-item'],['会话详情','route=secondary%3Asession-detail'],['PC 中枢详情','route=secondary%3Apc-detail'],['眼镜 / EEG 连接路径','route=secondary%3Adevice-detail&device=glasses'],['手表连接路径','route=secondary%3Adevice-detail&device=watch']]]
      ,['本轮新增：智能体、知识编辑、双流与画布',[['智能体对话','route=agent'],['智能体资料库','route=agent&agentView=library'],['眼镜第一视角发现','route=discover&stream=glasses'],['第一视角 L0–L4','route=content&stream=glasses&level=l0'],['新建子节点','route=secondary%3Aknowledge-create'],['建立双向链接','route=secondary%3Aknowledge-link'],['重命名节点','route=secondary%3Aknowledge-rename'],['删除节点确认','route=secondary%3Aknowledge-delete'],['知识脉络全屏画布','route=secondary%3Acanvas'],['状态流与质量','route=secondary%3Asensor-status']]]
    ];
    const base='index.html?embed=1';
    const href=param=>param?`${base}&${param}`:base;
    document.querySelector('#gallery').innerHTML=groups.map(([title,pages])=>`<section class="section"><h2>${title}<span>${pages.length} 个页面</span></h2><div class="grid">${pages.map(([name,param])=>`<article class="tile"><div class="tile-top"><b>${name}</b><a href="${href(param)}" target="_blank">全屏查看 ↗</a></div><div class="frame"><div class="device-scale"><iframe title="${name}" src="${href(param)}"></iframe></div></div></article>`).join('')}</div></section>`).join('');
  </script>
</body>
</html>
