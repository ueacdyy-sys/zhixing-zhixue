<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1210" viewBox="0 0 1800 1210">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F7F7"/><stop offset="1" stop-color="#E6EEEC"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1C3330" flood-opacity=".16"/></filter>
    <style>
      .t{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#1C2928}.m{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#687875}.s{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#8A9996}.h{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#1C2928;font-weight:700}.cap{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#335E57;font-weight:700;letter-spacing:1px}.phone{fill:#FCFDFD;stroke:#213532;stroke-width:8}.line{stroke:#D7E2DE;stroke-width:1}.pill{fill:#E6F1EE}.accent{fill:#2F776A}.accent2{fill:#D7EDE8}.soft{fill:#F3F7F6}.card{fill:#FFFFFF;stroke:#E1E9E7;stroke-width:1}.tag{fill:#E9F3F0}.node{fill:#D7EDE8;stroke:#2F776A;stroke-width:2}.link{stroke:#9DBDB6;stroke-width:2}.nav{fill:#F6F9F8;stroke:#E1E9E7;stroke-width:1}.btn{fill:#2F776A}.btn2{fill:#E7F0EE}.white{fill:#FFFFFF;font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-weight:700}
    </style>
  </defs>
  <rect width="1800" height="1210" fill="url(#bg)"/>
  <text x="70" y="62" class="h" font-size="30">知行智学 · 手机端完整 UI 设计示意</text>
  <text x="70" y="93" class="m" font-size="16">静默采集不等于打扰学习；所有学习推进必须由学生主动选择。</text>
  <line x1="70" x2="1730" y1="118" y2="118" class="line"/>

  <!-- 01 authorization -->
  <g transform="translate(70 150)" filter="url(#shadow)">
    <rect width="365" height="470" rx="38" class="phone"/><rect x="126" y="14" width="113" height="18" rx="9" fill="#213532"/>
    <text x="28" y="70" class="cap" font-size="13">01 / 会话与授权</text><text x="28" y="106" class="h" font-size="26">今天，先由你决定</text>
    <text x="28" y="136" class="m" font-size="14">仅在公开媒体会话中采集必要证据</text>
    <rect x="26" y="164" width="313" height="132" rx="20" class="card"/>
    <circle cx="56" cy="198" r="14" class="accent2"/><path d="M50 198h12M56 192v12" stroke="#2F776A" stroke-width="2"/>
    <text x="82" y="199" class="h" font-size="16">公开媒体会话</text><text x="82" y="223" class="m" font-size="13">屏幕媒体 · 同源音频 · 必要操作事实</text>
    <text x="45" y="264" class="s" font-size="12">不采集聊天、输入、相册、支付、剪贴板</text>
    <rect x="26" y="316" width="313" height="52" rx="15" class="btn"/><text x="118" y="349" class="white" font-size="16">开始本次会话</text>
    <text x="28" y="400" class="m" font-size="13">设备状态</text><circle cx="42" cy="427" r="5" fill="#2F776A"/><text x="58" y="432" class="t" font-size="14">手机已连接 · PC 中枢可达</text>
  </g>

  <!-- 02 inbox -->
  <g transform="translate(500 150)" filter="url(#shadow)">
    <rect width="365" height="470" rx="38" class="phone"/><rect x="126" y="14" width="113" height="18" rx="9" fill="#213532"/>
    <text x="28" y="70" class="cap" font-size="13">02 / 今日学习</text><text x="28" y="106" class="h" font-size="26">可回看的发现</text>
    <text x="28" y="137" class="m" font-size="14">只展示已完成完整证据链的内容</text>
    <rect x="26" y="164" width="313" height="182" rx="20" class="card"/>
    <rect x="44" y="184" width="58" height="58" rx="14" class="accent2"/><text x="60" y="220" class="accent" font-size="22">知</text>
    <text x="118" y="204" class="h" font-size="17">二分查找的边界条件</text><text x="118" y="228" class="m" font-size="12">算法 · 12:48–13:26 · 三模态证据完整</text>
    <line x1="44" x2="321" y1="259" y2="259" class="line"/><text x="44" y="286" class="m" font-size="13">视频在解释“为什么循环条件是 left ≤ right”</text>
    <rect x="44" y="301" width="118" height="30" rx="15" class="pill"/><text x="66" y="321" class="accent" font-size="12">查看概念小结 →</text>
    <text x="28" y="384" class="h" font-size="15">学习记录</text><text x="28" y="411" class="m" font-size="13">3 条候选 · 1 条已保存 · 无自动升级</text>
    <rect x="24" y="428" width="317" height="28" rx="14" class="nav"/><text x="65" y="447" class="accent" font-size="12">发现</text><text x="170" y="447" class="s" font-size="12">图谱</text><text x="271" y="447" class="s" font-size="12">我的</text>
  </g>

  <!-- 03 l1 -->
  <g transform="translate(930 150)" filter="url(#shadow)">
    <rect width="365" height="470" rx="38" class="phone"/><rect x="126" y="14" width="113" height="18" rx="9" fill="#213532"/>
    <text x="28" y="70" class="cap" font-size="13">03 / L1 概念浅讲</text><text x="28" y="105" class="h" font-size="25">二分查找的边界</text>
    <rect x="28" y="126" width="160" height="25" rx="12" class="tag"/><text x="41" y="143" class="accent" font-size="11">来自本次视频 12:48–13:26</text>
    <text x="28" y="181" class="m" font-size="14">在有序数组中，每轮排除一半区间；</text><text x="28" y="205" class="m" font-size="14">当左右端点相等时，最后一个候选值仍需检查。</text>
    <rect x="28" y="235" width="309" height="83" rx="16" class="soft"/><text x="46" y="264" class="h" font-size="14">最小例子</text><text x="46" y="289" class="m" font-size="13">[1, 3, 5] 中找 5：left 与 right</text><text x="46" y="308" class="m" font-size="13">相等时，仍须完成最后一次比较。</text>
    <text x="28" y="353" class="s" font-size="12">证据：ASR · OCR · 连续视频语义已互证</text>
    <rect x="28" y="382" width="150" height="48" rx="15" class="btn"/><text x="65" y="412" class="white" font-size="14">继续探索 L2</text>
    <text x="220" y="411" class="accent" font-size="14">保存　稍后</text>
  </g>

  <!-- 04 L2 graph -->
  <g transform="translate(1360 150)" filter="url(#shadow)">
    <rect width="365" height="470" rx="38" class="phone"/><rect x="126" y="14" width="113" height="18" rx="9" fill="#213532"/>
    <text x="28" y="70" class="cap" font-size="13">04 / L2 深入探究</text><text x="28" y="105" class="h" font-size="25">知识关系图</text>
    <line x1="105" y1="187" x2="188" y2="160" class="link"/><line x1="188" y1="160" x2="276" y2="206" class="link"/><line x1="188" y1="160" x2="204" y2="268" class="link"/>
    <circle cx="105" cy="187" r="34" class="node"/><circle cx="188" cy="160" r="40" class="accent"/><circle cx="276" cy="206" r="35" class="node"/><circle cx="204" cy="268" r="36" class="node"/>
    <text x="79" y="191" class="t" font-size="12">有序数组</text><text x="164" y="164" class="white" font-size="12">二分查找</text><text x="249" y="210" class="t" font-size="12">循环不变式</text><text x="182" y="272" class="t" font-size="12">边界条件</text>
    <rect x="28" y="325" width="309" height="42" rx="13" class="soft"/><text x="44" y="351" class="m" font-size="13">关系：二分查找 → 依赖 → 有序数组</text>
    <text x="28" y="397" class="h" font-size="14">可信材料</text><text x="28" y="421" class="accent" font-size="13">国家精品课程 · 算法导论章节  ↗</text><text x="28" y="445" class="accent" font-size="13">教材配套练习 · 二分查找  ↗</text>
  </g>

  <!-- 05 L3 -->
  <g transform="translate(70 675)" filter="url(#shadow)">
    <rect width="365" height="470" rx="38" class="phone"/><rect x="126" y="14" width="113" height="18" rx="9" fill="#213532"/>
    <text x="28" y="70" class="cap" font-size="13">05 / L3 引导练习</text><text x="28" y="105" class="h" font-size="25">带着解析做一题</text>
    <text x="28" y="143" class="m" font-size="14">在 [2, 5, 8, 12, 16] 中查找 12，</text><text x="28" y="166" class="m" font-size="14">第一次比较的中点下标是多少？</text>
    <rect x="28" y="199" width="309" height="53" rx="14" class="card"/><text x="48" y="232" class="t" font-size="14">A　1</text><rect x="28" y="264" width="309" height="53" rx="14" class="accent2"/><text x="48" y="297" class="t" font-size="14">B　2　✓</text>
    <rect x="28" y="333" width="309" height="70" rx="14" class="soft"/><text x="46" y="358" class="h" font-size="13">解析</text><text x="46" y="382" class="m" font-size="12">left=0，right=4，mid=(0+4)/2=2。</text>
    <text x="28" y="435" class="accent" font-size="14">继续一题　　转入自主练习 →</text>
  </g>

  <!-- 06 L4 -->
  <g transform="translate(500 675)" filter="url(#shadow)">
    <rect width="365" height="470" rx="38" class="phone"/><rect x="126" y="14" width="113" height="18" rx="9" fill="#213532"/>
    <text x="28" y="70" class="cap" font-size="13">06 / L4 自主练习</text><text x="28" y="105" class="h" font-size="25">独立完成，不给答案</text>
    <text x="28" y="143" class="m" font-size="14">给定有序数组与目标值，请写出</text><text x="28" y="166" class="m" font-size="14">二分查找的循环终止条件，并说明原因。</text>
    <rect x="28" y="200" width="309" height="147" rx="16" fill="#FBFCFC" stroke="#BED0CC" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="48" y="233" class="s" font-size="13">在这里写下你的解释…</text>
    <text x="28" y="382" class="s" font-size="12">提交后仅记录本次学习过程证据，不作能力诊断。</text>
    <rect x="28" y="410" width="309" height="48" rx="15" class="btn"/><text x="135" y="440" class="white" font-size="15">提交本次练习</text>
  </g>

  <!-- 07 profile -->
  <g transform="translate(930 675)" filter="url(#shadow)">
    <rect width="365" height="470" rx="38" class="phone"/><rect x="126" y="14" width="113" height="18" rx="9" fill="#213532"/>
    <text x="28" y="70" class="cap" font-size="13">07 / 我的知识轨迹</text><text x="28" y="105" class="h" font-size="25">证据，而不是标签</text>
    <rect x="28" y="133" width="309" height="72" rx="17" class="soft"/><text x="48" y="163" class="h" font-size="15">算法 · 二分查找</text><text x="48" y="187" class="m" font-size="12">已保存 · 1 次 L2 探究 · 本周</text>
    <rect x="28" y="218" width="309" height="72" rx="17" class="soft"/><text x="48" y="248" class="h" font-size="15">语文 · 修辞与表达</text><text x="48" y="272" class="m" font-size="12">候选中 · 证据待你确认</text>
    <text x="28" y="333" class="h" font-size="15">你可以管理</text><text x="28" y="360" class="m" font-size="13">查看证据来源 · 删除记录 · 导出本地数据</text>
    <line x1="28" x2="337" y1="383" y2="383" class="line"/><text x="28" y="414" class="accent" font-size="14">管理数据与许可范围 →</text>
  </g>

  <!-- 08 devices -->
  <g transform="translate(1360 675)" filter="url(#shadow)">
    <rect width="365" height="470" rx="38" class="phone"/><rect x="126" y="14" width="113" height="18" rx="9" fill="#213532"/>
    <text x="28" y="70" class="cap" font-size="13">08 / 设备与隐私</text><text x="28" y="105" class="h" font-size="25">连接是可控的</text>
    <text x="28" y="145" class="h" font-size="15">本地 PC 中枢</text><circle cx="312" cy="140" r="7" fill="#2F776A"/><text x="28" y="169" class="m" font-size="13">已配对 · 局域网加密通道 · 可断开</text>
    <line x1="28" x2="337" y1="192" y2="192" class="line"/>
    <text x="28" y="228" class="h" font-size="15">本次会话范围</text><text x="28" y="252" class="m" font-size="13">公开媒体屏幕 + 播放音频 + 必要事件</text><text x="28" y="277" class="m" font-size="13">私密内容与禁止范围：自动失败关闭</text>
    <line x1="28" x2="337" y1="300" y2="300" class="line"/>
    <text x="28" y="334" class="h" font-size="15">连接设备</text><text x="28" y="361" class="m" font-size="13">手机　在线　　PC　在线</text><text x="28" y="386" class="s" font-size="12">眼镜 / 手表：未接入，不参与结论</text>
    <rect x="28" y="413" width="309" height="45" rx="15" class="btn2"/><text x="125" y="441" class="accent" font-size="14">结束并保留本机证据</text>
  </g>
  <text x="70" y="1185" class="s" font-size="13">v1 设计原则：内容包由 PC 真实三模态结果回传；没有完整内容包时不显示 L1–L4 假入口。</text>
</svg>
