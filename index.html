<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>知行智学 · 可点击应用原型 V5</title>
  <style>
/* === 知行智学 · 单一 token 表(8 轮补丁合并) === */
:root{
  --bg:#f5f5f7;--surface:#fff;--paper:#fff;--soft:#f6f8fa;
  --ink:#202124;--muted:#70757d;--line:#e3e7ec;
  --blue:#0877e8;--blue-soft:#eaf3fe;
  --green:#16804a;--green-soft:#eaf6ee;
  --amber:#9f6200;--amber-soft:#fff4dc;
  --red:#bd3245;--red-soft:#fff0f2;
  --mint:#e9f7f1;--lavender:#f2effb;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --r:14px;--r-sm:10px;
  --glass-shadow:0 14px 34px rgba(42,86,136,.10),0 2px 5px rgba(42,86,136,.05);
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(620px 480px at 16% 4%,#e9f3ff 0%,transparent 68%),radial-gradient(600px 500px at 92% 100%,#edf8f3 0%,transparent 70%),#eef2f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);letter-spacing:0}
button,input,select{font:inherit}
button{color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid rgba(8,119,232,.4);outline-offset:2px}

/* === 舞台与手机框 === */
.stage{min-height:100vh;display:grid;place-items:center;padding:20px;background:transparent}
.phone{width:min(100%,430px);height:min(900px,calc(100vh - 56px));min-height:700px;position:relative;overflow:hidden;background:linear-gradient(180deg,#f8fbfe 0%,#f2f6fa 100%);border:7px solid #202124;border-radius:40px;box-shadow:0 30px 70px rgba(37,69,108,.22)}
.island{position:absolute;z-index:8;left:50%;transform:translateX(-50%);top:11px;width:122px;height:28px;border-radius:16px;background:#141519}

/* === 应用容器与顶栏(压缩留白) === */
.app{height:100%;overflow:auto;padding:70px 16px 120px;scroll-behavior:smooth;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(241,247,252,.18));scrollbar-width:none;-ms-overflow-style:none}
.app::-webkit-scrollbar{display:none;width:0;height:0}
.top{height:36px;position:absolute;left:0;top:47px;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 19px;font-size:12px;font-weight:600;background:linear-gradient(180deg,rgba(246,250,253,.82),rgba(246,250,253,0));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top-title{font-size:12px;color:#6e6e73}
.icon-btn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:17px}

/* === 排版 === */
.page-head{display:flex;align-items:end;justify-content:space-between;margin:2px 0 13px}
.page-head h1{font-size:24px;line-height:1.14;letter-spacing:-.045em;margin:0;font-weight:720}
.page-head p,.hint{font-size:11px;line-height:1.48;color:var(--muted);margin:4px 0 0}
.page-head p{max-width:260px}
.text-btn{font-size:13px;color:var(--blue);font-weight:600;padding:6px}
.eyebrow{font-size:10px;font-weight:650;color:var(--muted);letter-spacing:.02em;margin:17px 4px 7px}

/* === 卡片(最终:白底无玻璃态) === */
.card{background:var(--paper);border:1px solid rgba(31,45,61,.07);box-shadow:0 2px 8px rgba(32,47,65,.045);border-radius:var(--r);padding:14px;margin:9px 0}
.card.press{width:100%;text-align:left;transition:background .15s,transform .12s,box-shadow .12s}
.card.press:hover{background:#fff;box-shadow:0 5px 16px rgba(32,47,65,.08)}
.card.press:active{transform:scale(.992)}
.card.list,.list.card{background:#fff;box-shadow:0 2px 8px rgba(31,55,83,.042)}

/* === 通用行 === */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title-sm{font-size:14px;font-weight:680;letter-spacing:-.01em}
.body{font-size:12px;line-height:1.6;color:#4d535c;margin:7px 0}
.meta{font-size:10px;line-height:1.5;color:var(--muted)}

/* === 标签 === */
.pill{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:3px 7px;border-radius:999px;background:var(--blue-soft);color:#075cb8;font-size:9.5px;font-weight:650;white-space:nowrap;border:1px solid rgba(10,112,219,.08)}
.pill.good{background:var(--green-soft);color:var(--green);border-color:transparent}
.pill.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.pill.bad{background:var(--red-soft);color:var(--red);border-color:transparent}
.chev{font-size:18px;color:#a6a8ad}

/* === 列表 === */
.list{padding:0;overflow:hidden;border-radius:14px}
.list-row{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);min-height:52px}
.list-row:last-child{border-bottom:0}
.list-row .l-icon{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:#f1f5f9;color:#3d6f9f;font-size:14px;flex:0 0 auto}
.list-row .copy{flex:1;min-width:0}
.list-row b{display:block;font-size:12px;font-weight:650}
.list-row small{display:block;color:var(--muted);font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* === 底部导航 === */
.nav{position:absolute;z-index:5;left:14px;right:14px;bottom:14px;height:66px;display:flex;align-items:center;justify-content:space-around;border:1px solid rgba(0,0,0,.06);border-radius:18px;background:rgba(249,252,255,.94);backdrop-filter:blur(26px) saturate(130%);-webkit-backdrop-filter:blur(26px) saturate(130%);box-shadow:0 12px 26px rgba(38,78,121,.14),inset 0 1px rgba(255,255,255,.95)}
.nav button{min-width:68px;height:49px;border-radius:13px;color:#7c818c;font-size:10px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}
.nav button span{font-size:18px;line-height:14px}
.nav button.active{color:var(--blue);font-weight:650;background:#e5f1ff}

/* === 横幅 === */
.banner{position:absolute;z-index:22;left:16px;right:16px;top:49px;display:none;padding:12px 13px;border-radius:14px;background:rgba(247,252,255,.9);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(26px) saturate(130%);-webkit-backdrop-filter:blur(26px) saturate(130%);box-shadow:0 10px 28px rgba(0,0,0,.16);text-align:left}
.banner.show{display:block;animation:drop .28s ease-out}
@keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}
.banner b{display:block;font-size:12px}
.banner small{color:var(--muted);font-size:10px;display:block;margin:3px 0 8px}
.banner .row{justify-content:flex-end}

/* === 按钮 === */
.primary,.secondary,.danger{width:100%;border-radius:11px;min-height:40px;padding:9px 12px;font-size:12px;font-weight:650;margin-top:9px}
.primary{background:#0877e8;color:#fff;box-shadow:0 4px 12px rgba(8,119,232,.18)}
.secondary{background:#f2f7fc;color:#075cb8;border:1px solid #deebf7}
.danger{background:var(--red-soft);color:var(--red)}
.card .secondary{display:flex;align-items:center;justify-content:flex-start;min-height:38px;padding:8px 12px;text-align:left}
.card .secondary:after{content:'›';margin-left:auto;font-size:18px;line-height:1;color:#7f9fc0;font-weight:400}

/* === 分段控件 === */
.seg{display:flex;gap:2px;overflow:auto;margin:7px 0 12px;padding:3px;background:#eff2f5;border:0;border-radius:10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;padding:6px 9px;border-radius:8px;background:transparent;color:#636975;font-size:10px;font-weight:620}
.seg button.active{background:#fff;color:#1c5d9f;box-shadow:0 1px 3px rgba(0,0,0,.09)}

/* === L 等级控件 === */
.level{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:4px 0 15px;background:#eceef1;padding:3px;border-radius:10px}
.level button{padding:7px 2px;border-radius:8px;background:transparent;color:#6f7480;font-size:10px;font-weight:700}
.level button.active{color:#fff;background:#202124}

/* === 提示与事实块 === */
.callout{border-left:2px solid var(--blue);padding:8px 10px;background:#f0f6fd;border-radius:0 8px 8px 0;font-size:11px;line-height:1.55;color:#37516b}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:9px 0}
.fact{padding:8px;background:#f6f7f8;border-radius:9px}
.fact b{font-size:11px;display:block}
.fact span{font-size:9.5px;color:var(--muted);margin-top:3px;display:block}

/* === 知识地图与节点 === */
.map{height:232px;border-radius:12px;position:relative;overflow:hidden;background:#fbfdff;background-image:radial-gradient(circle at 1px 1px,rgba(48,105,162,.12) 1px,transparent 0);background-size:18px 18px;border:1px solid #e1e9f2;box-shadow:inset 0 1px rgba(255,255,255,.92)}
.map svg{width:100%;height:100%;position:absolute;inset:0}
.node{position:absolute;z-index:1;border:1px solid #d9e0e7;background:rgba(255,255,255,.96);box-shadow:0 2px 6px rgba(37,61,88,.09);border-radius:8px;padding:6px 9px;font-size:10.5px;font-weight:650}
.node.core{background:#1d2024;border-color:#1d2024;color:#fff;border-radius:10px;box-shadow:0 4px 9px rgba(24,29,35,.14);cursor:pointer}
.node-add{position:absolute;z-index:2;top:87px;left:calc(50% + 19px);width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:#fbfdff;color:#1870ba;border:1px solid #b7cee2;box-shadow:0 2px 6px rgba(38,78,114,.13);font-size:16px;line-height:1}

/* === 来源项 === */
.source-item{display:flex;gap:9px;padding:12px 0;border-bottom:1px solid var(--line)}
.source-item:last-child{border:0}
.source-item .dot{margin-top:5px;width:6px;height:6px;border-radius:50%;background:var(--green);flex:0 0 auto}
.source-item b{font-size:12px;display:block}
.source-item span{font-size:10px;color:var(--muted);display:block;margin-top:3px}

/* === 练习与作答 === */
.question{font-size:14px;line-height:1.55;font-weight:650}
.answer{width:100%;min-height:86px;border:1px solid #dbe4ed;background:#fbfcfe;border-radius:10px;padding:10px;resize:none;margin-top:10px;color:var(--ink);font-size:12px;box-shadow:inset 0 1px 2px rgba(31,51,76,.025)}
.card:has(.answer){background:linear-gradient(180deg,#fff,#fcfdff);box-shadow:0 4px 13px rgba(31,55,83,.055)}

/* === Toast === */
.toast{position:absolute;z-index:30;left:50%;bottom:99px;transform:translateX(-50%) translateY(25px);opacity:0;pointer-events:none;background:#202329;color:#fff;border-radius:999px;padding:9px 14px;font-size:12px;transition:.2s}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* === 图表区 === */
.chart-area{min-height:235px;position:relative;border-radius:12px;background:#fbfdff;background-image:linear-gradient(rgba(29,29,31,.028) 1px,transparent 1px);background-size:100% 30px;border:1px solid #e6eef7;box-shadow:inset 0 1px rgba(255,255,255,.9);overflow:hidden;padding:12px}
.chart-label{font-size:10px;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:11px;font-size:10px;color:var(--muted)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}
.venn{height:164px;position:relative}
.venn span{position:absolute;width:115px;height:115px;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:11px;font-weight:650}
.venn .a{left:42px;top:25px;background:rgba(8,119,232,.20);border:1px solid #4f9ce9}
.venn .b{left:126px;top:25px;background:rgba(22,128,74,.18);border:1px solid #62bc88}
.venn .c{left:84px;top:70px;background:rgba(159,98,0,.18);border:1px solid #e7ad45}
.bars{height:180px;display:flex;align-items:end;gap:14px;padding:22px 13px 22px;border-bottom:1px solid #cbd0d7}
.bars i{width:30px;background:#0877e8;border-radius:5px 5px 1px 1px;position:relative}
.bars i::after{content:attr(data-name);font-style:normal;position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);white-space:nowrap}
.linechart svg,.scatter svg{width:100%;height:190px}
.pie{height:185px;display:grid;place-items:center}
.pie-ring{width:137px;height:137px;border-radius:50%;background:conic-gradient(#0877e8 0 38%,#2e9e64 38% 63%,#d49b2b 63% 82%,#b5bac4 82%);position:relative}
.pie-ring:after{content:'主题来源';position:absolute;inset:31px;border-radius:50%;background:#f8f9fb;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.setchart{height:183px;position:relative}
.setbox{position:absolute;border:1.5px solid #4899e8;border-radius:12px;padding:9px;font-size:10px}
.setbox.a{top:13px;left:12px;width:182px;height:134px}
.setbox.b{top:43px;right:13px;width:166px;height:116px;border-color:#54b47a}
.setchip{display:inline-block;margin:2px;padding:4px 6px;border-radius:7px;background:#e8f2ff}
.setchip.g{background:#e8f7ef}

/* === 设置 === */
.settings-shell{display:flex;align-items:center;gap:9px;margin-bottom:18px}
.settings-shell h1{font-size:20px;margin:0;letter-spacing:-.035em}
.switch{width:42px;height:25px;border-radius:20px;background:#c8ccd3;position:relative;transition:.2s;flex:0 0 auto}
.switch:after{content:'';width:21px;height:21px;border-radius:50%;background:#fff;position:absolute;left:2px;top:2px;box-shadow:0 1px 3px #999;transition:.2s}
.switch.on{background:var(--green)}
.switch.on:after{transform:translateX(17px)}
.setting-option{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}
.setting-option:last-child{border:0}
.setting-option small{color:var(--muted);display:block;margin-top:3px;font-size:10px}
.radio{width:18px;height:18px;border:1.5px solid #b3b8c2;border-radius:50%;position:relative}
.radio.on{border-color:var(--blue)}
.radio.on:after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--blue)}

/* === 遮罩与抽屉(可访问性修复) === */
.scrim{display:none;position:absolute;z-index:10;inset:0;background:rgba(20,26,35,.28)}
.scrim.show{display:block}
.drawer{position:absolute;z-index:12;top:0;bottom:0;left:0;width:min(280px,calc(100% - 122px));overflow:auto;padding:52px 14px 24px;background:rgba(247,252,255,.9);border-right:1px solid rgba(255,255,255,.86);backdrop-filter:blur(26px) saturate(130%);-webkit-backdrop-filter:blur(26px) saturate(130%);box-shadow:16px 0 42px rgba(35,77,125,.18),inset -1px 0 0 rgba(255,255,255,.76);transform:translateX(-106%);transition:transform .25s,visibility .25s;visibility:hidden;scrollbar-width:none}
.drawer::-webkit-scrollbar{display:none}
.drawer.show{transform:translateX(0);visibility:visible}
.drawer h2{font-size:23px;font-weight:700;letter-spacing:-.04em;margin:4px 3px 2px}
.drawer p{font-size:10px;color:var(--muted);margin:0 3px 16px}

/* === 通用工具 === */
.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px}
.back{font-size:13px;font-weight:650;color:var(--blue);padding:6px 0;margin-bottom:11px}
.detail-top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.detail-top h1{font-size:20px;line-height:1.25;margin:0;letter-spacing:-.035em;font-weight:720}
.disabled{opacity:.45;pointer-events:none}

/* === SVG 图标 === */
.svg-icon{width:18px;height:18px;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top .svg-icon{width:17px;height:17px}
.l-icon .svg-icon{width:15px;height:15px}
.nav .svg-icon{width:19px;height:19px;stroke-width:1.75}

/* === 会话卡(最终:浅蓝渐变) === */
.session-card{background:linear-gradient(135deg,#edf6ff 0%,#fafdff 100%);border-color:#e0edf8;box-shadow:0 6px 18px rgba(45,111,177,.075)}
.session-card .secondary{background:rgba(255,255,255,.76);border-color:#e5eef7}

/* === 消息卡 === */
.message{position:relative;overflow:hidden;padding-left:17px;background:#fff;border-color:#e8edf2;box-shadow:0 3px 11px rgba(31,55,83,.05)}
.message:before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:#c6c9cf}
.message-ai:before{background:#0877e8}
.message-history:before{background:#238a55}
.message-poetry:before{background:#ce9425}
.message-ai{border-color:#d9e9fb;border-left:0}
.message-history{border-color:#dcefe3;background:#fcfffd}
.message .body{margin:7px 0 8px;max-width:92%}
.message .meta:last-child{font-size:10px;padding-top:2px}

/* === 知识工作区 === */
.knowledge-tools{display:grid;grid-template-columns:1fr auto auto;gap:7px;margin:0 0 11px}
.knowledge-tools button{height:36px;border-radius:10px;padding:0 10px;font-size:11px;font-weight:650;background:#fff;border:1px solid #e1e7ee;box-shadow:0 1px 3px rgba(28,52,79,.045)}
.knowledge-tools button:first-child{background:#17191d;color:#fff;border-color:#17191d;box-shadow:0 4px 12px rgba(24,27,31,.16)}
.knowledge-tools button:not(:first-child){color:#4e6479}
.knowledge-workspace{background:linear-gradient(180deg,#fff,#fcfdff);padding:15px 14px 13px}
.knowledge-workspace .hint{max-width:300px}
.note-actions{display:flex;gap:6px;overflow:auto;margin:11px 0 -1px;padding:5px;border:1px solid #e2e9f0;border-radius:11px;background:#f8fafc}
.note-actions button{white-space:nowrap;height:28px;padding:0 9px;border:0;background:transparent;border-radius:7px;color:#396381;font-size:10px;font-weight:650}
.note-actions button:first-child{background:#eaf3fc;color:#0872d8}
.note-actions button:last-child{margin-left:auto;color:#ad3b49;background:#fff0f2}
.knowledge-tab{margin-top:8px}
.knowledge-meta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 1px}
.knowledge-meta button{font-size:10px;border-radius:999px;padding:5px 8px;background:#f0f4f8;color:#566573}
.knowledge-meta button:first-child{background:var(--lavender);color:#5c4f9b}
.knowledge-empty{border:1px dashed #cbd8e5;border-radius:12px;padding:13px;color:#667382;font-size:11px;line-height:1.55;background:#fbfdff}
.stream-picker{margin:-2px 0 11px;padding:3px}
.stream-picker button{flex:1;text-align:center;padding:8px 6px;font-size:10.5px;min-height:31px}
.stream-picker button.active{box-shadow:0 1px 4px rgba(24,46,72,.1)}

/* === 全屏画布 === */
.canvas-expand{position:absolute;z-index:3;right:9px;top:9px;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.94);border:1px solid #dbe7f1;color:#386a99;box-shadow:0 3px 9px rgba(34,71,106,.12);font-size:0}
.canvas-expand:before,.canvas-expand:after{content:'';position:absolute;width:8px;height:8px;border-color:currentColor}
.canvas-expand:before{left:8px;top:8px;border-left:1.5px solid;border-top:1.5px solid}
.canvas-expand:after{right:8px;bottom:8px;border-right:1.5px solid;border-bottom:1.5px solid}
.canvas-wrap{position:relative}
.full-canvas{position:relative;min-height:650px;margin:0 -16px -110px;padding:8px 16px 120px;background:linear-gradient(180deg,#f7fbff,#eef5fa)}
.full-map{height:460px;margin:12px 0;border-radius:18px;position:relative;overflow:hidden;background-color:#fbfdff;background-image:radial-gradient(circle at 1px 1px,rgba(48,105,162,.14) 1px,transparent 0);background-size:20px 20px;border:1px solid #dce8f2;box-shadow:inset 0 1px rgba(255,255,255,.95)}
.full-map svg{position:absolute;inset:0;width:100%;height:100%}
.full-map .node{cursor:grab;font-size:11px;padding:9px 12px}
.full-map .node:active{cursor:grabbing}
.full-map .node.core{top:200px;left:calc(50% - 50px)}
.full-map .node.n1{top:65px;left:25px}
.full-map .node.n2{top:75px;right:20px}
.full-map .node.n3{bottom:75px;left:24px}
.full-map .node.n4{bottom:70px;right:20px}
.full-map .node-add{top:206px;left:calc(50% + 20px);background:#fbfdff}
.canvas-help{font-size:11px;color:#65778a;line-height:1.55;margin:10px 4px;max-width:330px}
.map+.hint{padding:0 2px}

/* === 智能体工作台 === */
.agent-workbench{display:flex;flex-direction:column;min-height:760px;padding-bottom:6px}
.agent-compact-head{display:flex;align-items:center;justify-content:space-between;margin:0 1px 12px}
.agent-compact-head h1{font-size:22px;letter-spacing:-.04em;margin:0}
.agent-compact-head p{margin:3px 0 0;font-size:11px;color:var(--muted)}
.agent-utility{width:auto;min-height:34px;margin:0;padding:7px 10px;border-radius:11px;font-size:11px}
.chat-thread{display:flex;flex:1;flex-direction:column;gap:12px;padding:3px 2px 12px}
.chat-turn{display:flex;gap:8px;align-items:flex-end}
.chat-turn.user{justify-content:flex-end}
.chat-avatar{width:24px;height:24px;border:1px solid #dce2e8;border-radius:8px;background:#f0f4f7;color:#4d5b68;display:grid;place-items:center;font-size:10px;font-weight:750;flex:0 0 auto}
.chat-bubble{max-width:81%;padding:11px 12px;border:1px solid #e4e8ed;border-radius:16px 16px 16px 5px;background:rgba(255,255,255,.82);box-shadow:0 1px 1px rgba(22,30,38,.03);font-size:13px;line-height:1.6;color:#313840}
.chat-turn.user .chat-bubble{border-color:#d7e8fa;border-radius:16px 16px 5px 16px;background:#eaf4ff;color:#164672}
.chat-meta{margin-top:5px;font-size:10px;color:#7d8490}
.chat-reference-strip{display:flex;gap:6px;overflow:auto;padding:5px 1px 9px;scrollbar-width:none}
.chat-reference-strip::-webkit-scrollbar{display:none}
.reference-chip{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;max-width:230px;padding:7px 9px;border:1px solid #d7e5f0;border-radius:11px;background:rgba(247,251,255,.94);font-size:10px;color:#31556f}
.reference-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reference-chip button{color:#6c8093;font-size:14px;line-height:1;padding:0}
.chat-composer{position:sticky;bottom:84px;margin-top:auto;padding:9px;border:1px solid rgba(210,221,231,.95);border-radius:17px;background:rgba(255,255,255,.9);backdrop-filter:blur(22px);box-shadow:0 10px 28px rgba(30,49,70,.12)}
.chat-composer textarea{display:block;width:100%;min-height:44px;max-height:110px;margin:0;padding:4px;border:0;outline:0;resize:none;background:transparent;font-size:13px;line-height:1.45}
.chat-composer-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}
.chat-actions{display:flex;align-items:center;gap:6px}
.chat-icon-action{width:29px;height:29px;border:1px solid #d9e3eb;border-radius:9px;background:#f8fafc;color:#577188;font-size:15px;display:grid;place-items:center}
.chat-network{font-size:10px;color:#5a7082}
.chat-network.on{color:#177a51}
.chat-send{width:auto;min-height:30px;margin:0;padding:6px 12px;border-radius:10px;font-size:11px}

/* === 资料库 === */
.library-shell{padding-bottom:12px}
.library-tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}
.library-tabs::-webkit-scrollbar{display:none}
.library-tabs button{flex:0 0 auto;padding:7px 10px;border:1px solid #dbe4ec;border-radius:10px;background:#f8fafc;color:#687582;font-size:11px}
.library-tabs button.active{border-color:#b9d4ef;background:#ecf6ff;color:#116bbf}
.upload-well{padding:18px 14px;border:1.5px dashed #b9cfe1;border-radius:16px;background:linear-gradient(145deg,rgba(247,251,255,.98),rgba(236,246,253,.76));text-align:center}
.upload-well b{font-size:13px}
.upload-well p{margin:5px 0 11px;font-size:11px;line-height:1.5;color:var(--muted)}
.library-list{padding:0;overflow:hidden}
.library-entry{display:flex;width:100%;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid var(--line);text-align:left}
.library-entry:last-child{border-bottom:0}
.library-entry .resource-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:#edf2f9;font-size:13px;flex:0 0 auto}
.resource-note{font-size:10px;color:var(--muted);margin:10px 2px 0;line-height:1.5}

/* === 智能体 compose(旧版兼容) === */
.agent-compose{padding:11px;border:1px solid #dae6f0;border-radius:14px;background:linear-gradient(180deg,#ffffff,#f7fbff)}
.agent-compose textarea{margin:0;min-height:88px}
.agent-actions{display:flex;gap:8px;margin-top:9px}
.agent-actions button{margin:0}
.agent-result{border-left:3px solid #4b8fce}
.agent-source{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}
.agent-source:last-child{border-bottom:0}
.agent-source i{width:7px;height:7px;border-radius:50%;background:#4c9d72;margin-top:6px;flex:0 0 auto}
.agent-source b{font-size:12px;display:block}
.agent-source small{display:block;margin-top:3px;color:var(--muted);font-size:10px}
.file-preview{padding:11px;border:1px dashed #bdcee0;border-radius:12px;background:#fbfdff;font:11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;color:#435365;white-space:pre-wrap}

/* === 选择工具 === */
.selection-tools{padding:11px 12px;margin:0 0 12px;border:1px solid #cfe0ee;border-radius:13px;background:rgba(247,251,255,.96);box-shadow:0 4px 14px rgba(35,83,127,.08)}
.selection-tools .row{align-items:flex-start}
.selection-tools .primary,.selection-tools .secondary,.selection-tools .danger{width:auto;min-height:34px;padding:7px 9px;margin:9px 0 0;font-size:11px}
.selection-card{border-color:#9fc4e9;background:#f6fbff}
.selection-mark{width:21px;height:21px;display:grid;place-items:center;border:1.5px solid #aec5dc;border-radius:50%;color:transparent;font-size:12px;flex:0 0 auto}
.selection-mark.on{border-color:var(--blue);background:var(--blue);color:#fff}

/* === 嵌入模式(总览页 iframe):仅隐藏装饰性灵动岛,保留顶部栏 === */
.embed .island{display:none}

      agent=function(){let references=[...state.agentContext,...state.agentKnowledgeRefs];let chips=references.length?`<div class="chat-reference-strip">${references.map(ref=>`<div class="reference-chip"><span>${esc(ref.title)}</span>${action('agent-remove-reference',`data-id="${esc(ref.id)}" data-kind="${ref.streamType==='知识库'?'knowledge':'session'}" aria-label="移除引用 ${esc(ref.title)}"`,'×')}</div>`).join('')}</div>`:'';let messageHtml=state.agentMessages.map(message=>`<div class="chat-turn ${message.role==='user'?'user':'assistant'}">${message.role==='assistant'?'<span class="chat-avatar">知</span>':''}<div class="chat-bubble">${esc(message.text).replace(/\n/g,'<br>')}<div class="chat-meta">${esc(message.time)}</div></div>${message.role==='user'?'<span class="chat-avatar">我</span>':''}</div>`).join('');let chat=`<section class="agent-workbench"><div class="agent-compact-head"><div><h1>智能体</h1><p>对话、检索与文件任务统一在同一会话中完成</p></div>${action('agent-new-chat','class="secondary agent-utility"','新对话')}</div><div class="chat-thread">${messageHtml}</div>${chips}<div class="chat-composer"><textarea id="agent-chat-input" aria-label="输入智能体消息" placeholder="输入问题，或描述需要生成的文件…">${esc(state.agentDraft)}</textarea><div class="chat-composer-footer"><div class="chat-actions">${action('agent-library','class="chat-icon-action" aria-label="打开资料库"','＋')}${action('agent-toggle-network',`class="chat-icon-action" aria-label="${state.agentNetwork?'关闭':'开启'}联网检索"`,state.agentNetwork?'⌁':'○')}<span class="chat-network ${state.agentNetwork?'on':''}">${state.agentNetwork?'联网检索已开启':'仅使用当前资料'}</span></div>${action('agent-send','class="primary chat-send"','发送')}</div></div></section>`;let fileRows=state.agentFiles.length?state.agentFiles.map(file=>`<div class="library-entry"><span class="resource-icon">文</span><span class="resource-copy"><b>${esc(file.name)}</b><small>${esc(file.size)} · 待服务端解析</small></span>${action('agent-file-remove',`class="secondary resource-link" data-id="${esc(file.id)}"`,'移除')}</div>`).join(''):'<div class="library-empty">尚未添加本地资料。选择多个文件后会先进入本次资料队列。</div>';let fileLibrary=`<input id="agent-file-input" type="file" multiple hidden accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.csv,.txt,.md,.png,.jpg,.jpeg,.mp3,.m4a,.wav,.mp4"><section class="upload-well"><b>添加本地资料</b><p>支持一次选择多个文档、表格、图片、音频或视频。文件先进入本地资料队列，正式服务再执行上传与解析。</p>${action('agent-open-file-picker','class="primary"','选择文件')}</section><section class="card library-list">${fileRows}</section>`;let sessionRows=state.agentContext.length?state.agentContext.map(item=>`<div class="library-entry"><span class="resource-icon">会</span><span class="resource-copy"><b>${esc(item.title)}</b><small>${esc(item.streamType)} · ${esc(item.time)} · ${esc(item.evidenceState)}</small></span></div>`).join(''):'<div class="library-empty">当前对话没有发现会话引用。请返回发现页，主动多选后点“问智能体”。</div>';let sessionLibrary=`<section class="card library-list">${sessionRows}</section>${action('agent-open-discover-selection','class="secondary"','返回发现页选择会话')}<p class="resource-note">发现会话只能在发现页主动选择；资料库只展示当前对话已带入的只读引用。</p>`;let knowledgeNames=['生成式 AI','数字媒体','版权伦理','虚拟演员'];let knowledgeLibrary=`<section class="card library-list">${knowledgeNames.map(name=>{let active=state.agentKnowledgeRefs.some(item=>item.title===name);return `<div class="library-entry"><span class="resource-icon">知</span><span class="resource-copy"><b>${name}</b><small>知识全览节点 · 可编辑笔记与双向链接</small></span>${active?'<span class="pill good">已引用</span>':action('agent-add-knowledge',`class="secondary resource-link" data-node="${name}"`,'引用')}</div>`}).join('')}</section><p class="resource-note">AI 只能引用知识节点；对知识图谱的新增或修改仍须由学生在知识全览中确认。</p>`;let libraryBody=state.agentLibraryTab==='files'?fileLibrary:state.agentLibraryTab==='sessions'?sessionLibrary:knowledgeLibrary;let library=`<section class="library-shell"><div class="agent-compact-head"><div><h1>资料库</h1><p>把资料、知识节点和已引用会话组织到当前对话</p></div>${action('agent-view-chat','class="secondary agent-utility"','回到对话')}</div><div class="library-tabs">${[['files','文件与资料'],['sessions','发现会话'],['knowledge','知识库']].map(([id,label])=>action('agent-library-tab',`data-tab="${id}" class="${state.agentLibraryTab===id?'active':''}"`,label)).join('')}</div>${libraryBody}</section>`;return `${top('智能体')}${state.agentView==='library'?library:chat}`};
      const learningProfileBase=profile;profile=function(){return learningProfileBase().replaceAll('学习画像','学习分析').replaceAll('画像分析','学习分析').replaceAll('画像证据','学习证据')};
      const learningSecondaryBase=secondaryPage;secondaryPage=function(kind){return learningSecondaryBase(kind).replaceAll('学习画像','学习分析').replaceAll('画像分析','学习分析').replaceAll('画像证据','学习证据')};
      window.addEventListener('click',e=>{let b=e.target.closest('button[data-action]');if(!b)return;let a=b.dataset.action;if(!['agent-new-chat','agent-library','agent-view-chat','agent-library-tab','agent-open-file-picker','agent-file-remove','agent-add-knowledge','agent-open-discover-selection','agent-remove-reference','agent-toggle-network','agent-send'].includes(a))return;e.stopImmediatePropagation();if(a==='agent-new-chat'){state.agentContext=[];state.agentKnowledgeRefs=[];state.agentDraft='';state.agentMessages=[{role:'assistant',text:'新的对话已开始。你可以直接提问、检索公开资料或描述文件生成需求。',time:'现在'}];state.agentView='chat';state.agentScrollToBottom=false;return render()}if(a==='agent-library'){state.agentView='library';return render()}if(a==='agent-view-chat'){state.agentView='chat';return render()}if(a==='agent-library-tab'){state.agentLibraryTab=b.dataset.tab;return render()}if(a==='agent-open-file-picker'){return document.querySelector('#agent-file-input')?.click()}if(a==='agent-file-remove'){state.agentFiles=state.agentFiles.filter(file=>file.id!==b.dataset.id);return render()}if(a==='agent-add-knowledge'){let title=b.dataset.node;if(!state.agentKnowledgeRefs.some(item=>item.title===title))state.agentKnowledgeRefs.push({id:`knowledge:${title}`,title,streamType:'知识库',time:'知识全览节点',evidenceState:'学生可编辑'});return render()}if(a==='agent-open-discover-selection'){state.route='discover';state.agentView='chat';state.selectionMode=true;state.selectedSessions=[];return render()}if(a==='agent-remove-reference'){let id=b.dataset.id;if(b.dataset.kind==='knowledge')state.agentKnowledgeRefs=state.agentKnowledgeRefs.filter(item=>item.id!==id);else state.agentContext=state.agentContext.filter(item=>item.id!==id);return render()}if(a==='agent-toggle-network'){state.agentNetwork=!state.agentNetwork;return render()}if(a==='agent-send'){let text=document.querySelector('#agent-chat-input')?.value.trim();if(!text)return flash('请先输入消息');let now='现在';state.agentMessages.push({role:'user',text,time:now});state.agentMessages.push({role:'assistant',text:'已记录你的请求。当前原型会保留对话、引用与资料队列；联网检索、文件解析和生成结果将在真实服务接通后回填到这条会话。',time:now});state.agentDraft='';state.agentScrollToBottom=true;return render()}},{capture:true});
      document.addEventListener('change',e=>{let input=e.target;if(!(input instanceof HTMLInputElement)||input.id!=='agent-file-input')return;let files=Array.from(input.files||[]);if(!files.length)return;let additions=files.map((file,index)=>({id:`file:${Date.now()}:${index}`,name:file.name,size:file.size<1024*1024?`${Math.max(1,Math.round(file.size/1024))} KB`:`${(file.size/1024/1024).toFixed(1)} MB`}));state.agentFiles=[...state.agentFiles,...additions];state.agentView='library';state.agentLibraryTab='files';render();flash(`已加入 ${additions.length} 个文件到资料队列`)},true);
      const conversationAgentBase=agent;agent=function(){if(state.renderedRoute!=='agent'&&!state.agentContext.length)state.agentKnowledgeRefs=[];if(state.agentMode==='qa'&&state.agentContext.length&&state.agentView==='library'){state.agentView='chat';state.agentMode='chat'}return conversationAgentBase()};
      const visualKnowledgeBase=knowledgeOverview;knowledgeOverview=function(){return visualKnowledgeBase().replace('单击节点进入编辑；中心的 ＋ 只在“生成式 AI”下建立子节点。','点节点编辑；中心 ＋ 新建子节点。')};
      /* Audit V9: a graph is a single stateful canvas, never independent static lines and nodes. */
      state.knowledgeTab=state.knowledgeTab||'note';
      const graphEdges={knowledge:[['生成式 AI','数字媒体'],['生成式 AI','版权伦理'],['生成式 AI','虚拟演员'],['生成式 AI','创作流程']],content:[['空间叙事','建筑立面'],['空间叙事','街道尺度'],['空间叙事','公共活动'],['空间叙事','城市环境']]};
      const graphNames={knowledge:['数字媒体','版权伦理','虚拟演员','创作流程','生成式 AI'],content:['建筑立面','街道尺度','公共活动','城市环境','空间叙事']};
      const miniLayout={knowledge:{'数字媒体':{x:18,y:36},'版权伦理':{x:244,y:42},'虚拟演员':{x:18,y:166},'创作流程':{x:244,y:172},'生成式 AI':{x:126,y:99}}};
      function graphShell(kind,name,position,options={}){let editable=options.editable===true,full=options.full===true,actionName=options.actionName||'knowledge-open';let drag=full?' data-drag-shell="1"':'';return `<div class="graph-node-shell" data-graph-kind="${kind}" data-node="${esc(name)}"${drag} style="left:${position.x}px;top:${position.y}px">${action(actionName,`class="node graph-node ${name===graphNames[kind][4]?'core':''}" data-node="${esc(name)}"`,esc(name))}${editable?action('knowledge-child',`class="node-add graph-add" data-parent="${esc(name)}" aria-label="为 ${esc(name)} 新建子节点"`,'＋'):''}</div>`}
      function graphSvg(kind){return `<svg class="graph-svg" aria-hidden="true"><g fill="none" stroke="#a8c9e5" stroke-width="1.6" stroke-linecap="round">${graphEdges[kind].map(edge=>`<path data-edge="${edge[0]}|${edge[1]}"/>`).join('')}</g></svg>`}
      function graphCanvas(kind,options={}){let layout=options.full?state.graphLayout[kind]:miniLayout[kind];let editable=kind==='knowledge';return `<div class="${options.full?'full-map':'map knowledge-map'} graph-canvas" data-graph-canvas="${kind}">${options.expand?action('canvas-fullscreen',`class="canvas-expand" data-canvas="${kind}" aria-label="全屏查看并编辑知识图谱"`,'全屏查看'):''}${graphSvg(kind)}${graphNames[kind].map(name=>graphShell(kind,name,layout[name],{editable,full:options.full,actionName:kind==='content'?'node-detail':'knowledge-open'})).join('')}</div>`}
      function syncGraphEdges(scope=document){let canvases=[...scope.querySelectorAll('.graph-canvas')];if(scope instanceof Element&&scope.matches('.graph-canvas'))canvases.unshift(scope);canvases.forEach(canvas=>{let rect=canvas.getBoundingClientRect(),svg=canvas.querySelector('.graph-svg');if(!svg||rect.width<2||rect.height<2)return;svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);svg.querySelectorAll('[data-edge]').forEach(path=>{let [from,to]=path.dataset.edge.split('|'),a=[...canvas.querySelectorAll('.graph-node-shell')].find(node=>node.dataset.node===from),b=[...canvas.querySelectorAll('.graph-node-shell')].find(node=>node.dataset.node===to);if(!a||!b)return;let ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();let x1=ar.left+ar.width/2-rect.left,y1=ar.top+ar.height/2-rect.top,x2=br.left+br.width/2-rect.left,y2=br.top+br.height/2-rect.top;path.setAttribute('d',`M ${x1} ${y1} L ${x2} ${y2}`)})})}
      knowledgeOverview=function(){return `<section class="card knowledge-workspace"><div class="row"><div><b class="title-sm">当前知识脉络</b><p class="hint">汇总手机兴趣流与第一视角记录中，经学生确认的节点。</p></div></div>${graphCanvas('knowledge',{expand:true})}<p class="hint">单击节点编辑笔记；每个节点右缘的 ＋ 可新建其子节点。</p></section><section class="card list">${action('knowledge-open','class="list-row" data-node="生成式 AI"',`<span class="l-icon">${icon('discover')}</span><span class="copy"><b>生成式 AI</b><small>5 个双向链接 · 3 个来源证据</small></span><span class="chev">›</span>`)}${action('knowledge-open','class="list-row" data-node="数字媒体"',`<span class="l-icon">${icon('display')}</span><span class="copy"><b>数字媒体</b><small>2 个关联笔记 · 可继续手工编辑</small></span><span class="chev">›</span>`)}</section>`};
      canvasPage=function(kind){if(kind==='stats')return `${top('统计图')}${back('学习分析')}<div class="full-canvas"><div class="detail-top"><h1>学习分析统计</h1></div><p class="canvas-help">全屏查看当前统计图；统计始终可以回到来源证据，不解释人格、能力或心理状态。</p>${chartCanvasBase(state.chart)}</div>`;let content=kind==='content',title=content?'内容关系图':'知识脉络';return `${top(title)}${back(content?'L2 探究':'知识全览')}<div class="full-canvas"><div class="detail-top"><h1>${title}</h1></div><p class="canvas-help">拖动节点调整布局；单击节点打开内容。知识图谱中每个节点右缘的 ＋ 用于建立子节点。</p>${graphCanvas(content?'content':'knowledge',{full:true})}</div>`};
      const auditedSecondaryPage=secondaryPage;secondaryPage=function(kind){return kind==='canvas'?canvasPage(state.canvasKind):auditedSecondaryPage(kind)};
      const auditedRender=render;render=function(){auditedRender();app.classList.toggle('agent-screen',state.route==='agent');requestAnimationFrame(()=>{syncGraphEdges(app);if(state.route==='agent'&&state.agentScrollToBottom){let thread=app.querySelector('.chat-thread');if(thread)thread.scrollTop=thread.scrollHeight;state.agentScrollToBottom=false}})};
      let graphDrag=null,graphDragDelta=null,graphDragMoved=false;
      window.addEventListener('pointerdown',e=>{let shell=e.target.closest('.full-map [data-drag-shell]');if(!shell||e.target.closest('.graph-add'))return;let rect=shell.getBoundingClientRect();graphDrag=shell;graphDragDelta={x:e.clientX-rect.left,y:e.clientY-rect.top};graphDragMoved=false;shell.setPointerCapture?.(e.pointerId)},{capture:true});
      window.addEventListener('pointermove',e=>{if(!graphDrag)return;let canvas=graphDrag.closest('.graph-canvas'),rect=canvas?.getBoundingClientRect();if(!canvas||!rect)return;let x=Math.max(0,Math.min(rect.width-graphDrag.offsetWidth,e.clientX-rect.left-graphDragDelta.x)),y=Math.max(0,Math.min(rect.height-graphDrag.offsetHeight,e.clientY-rect.top-graphDragDelta.y));graphDrag.style.left=`${x}px`;graphDrag.style.top=`${y}px`;state.graphLayout[graphDrag.dataset.graphKind][graphDrag.dataset.node]={x,y};graphDragMoved=true;syncGraphEdges(canvas)},{capture:true});
      window.addEventListener('pointerup',()=>{graphDrag=null;graphDragDelta=null},{capture:true});
      window.addEventListener('click',e=>{if(!graphDragMoved)return;let shell=e.target.closest('.full-map [data-drag-shell]');if(shell){e.preventDefault();e.stopImmediatePropagation();graphDragMoved=false}},{capture:true});
      document.addEventListener('input',e=>{if(e.target instanceof HTMLTextAreaElement&&e.target.id==='agent-chat-input')state.agentDraft=e.target.value},true);
      render();
    })();
  </script>
