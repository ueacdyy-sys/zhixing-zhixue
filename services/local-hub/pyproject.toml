[project]
name = "zhixingzhixue-local-hub"
version = "0.1.0"
description = "知行智学本地可信中枢"
requires-python = ">=3.11,<3.12"
dependencies = []

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhixingzhixue_hub"]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
